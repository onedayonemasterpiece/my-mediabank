name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", "scripts/build-android.py", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "scripts/build-android.py", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build and verify CI APK
        run: python3 scripts/build-android.py --debug-only --no-install
      - uses: actions/upload-artifact@v4
        with:
          name: my-mediabank-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/android-build-verification.json
          if-no-files-found: error
